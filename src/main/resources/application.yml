spring:
  application:
    name: shopping-cart

  datasource:
    url: jdbc:mysql://localhost:3307/shopping_cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:sc_user}
    password: ${DB_PASSWORD:sc_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema lo controlan las migraciones de Flyway (db/migration); Hibernate
      # solo valida que las entidades coincidan, nunca modifica la base de datos.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    template:
      default-topic: cart-item-added

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

app:
  jwt:
    # En producción SIEMPRE se debe sobreescribir con la variable de entorno JWT_SECRET
    # (mínimo 32 caracteres, aleatorio). Este valor solo sirve para desarrollo local.
    secret: ${JWT_SECRET:dev-only-secret-please-change-in-prod-min-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
